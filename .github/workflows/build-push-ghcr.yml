name: Build and Push to GHCR
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: sparka-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate:
    if: github.repository == 'masonjames/sparka'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check and publish exact revision
        id: candidate
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        env:
          GHCR_TOKEN: ${{ github.token }}
        with:
          version: v0.21.9
          verb: call
          args: publish --revision=${{ github.sha }} --registry-username=${{ github.actor }} --registry-token=env:GHCR_TOKEN
      - name: Record immutable candidate for Dockhand review
        env:
          IMAGE: ${{ steps.candidate.outputs.output }}
          REVISION: ${{ github.sha }}
        run: |
          printf 'Source: `%s`\n\nCandidate: `%s`\n\nPublish only. Dockhand must bind an exact approved deployment plan, backup, migration rehearsal, rollback digest and runtime verification.\n' "$REVISION" "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
