name: Build and Push to GHCR
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: sparka-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate:
    if: github.repository == 'masonjames/sparka'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Bootstrap reviewed Dagger without publication credentials
        id: dagger
        shell: bash
        run: |
          dagger_bin="$(PROJECT_DAGGER_INSTALL_ROOT="$RUNNER_TEMP/dagger" ./scripts/bootstrap-dagger.sh)"
          printf 'binary=%s\n' "$dagger_bin" >> "$GITHUB_OUTPUT"
      - name: Check and publish exact revision
        id: candidate
        shell: bash
        env:
          DAGGER_BIN: ${{ steps.dagger.outputs.binary }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          image="$("$DAGGER_BIN" --engine=image+docker://registry.dagger.io/engine:v1.0.0-beta.21 call publish --revision="$GITHUB_SHA" --registry-username="$GITHUB_ACTOR" --registry-token=env:GHCR_TOKEN)"
          [[ "$image" =~ ^ghcr\.io/masonjames/sparka@sha256:[0-9a-f]{64}$ ]]
          printf 'output=%s\n' "$image" >> "$GITHUB_OUTPUT"
      - name: Record immutable candidate for Dockhand review
        env:
          IMAGE: ${{ steps.candidate.outputs.output }}
          REVISION: ${{ github.sha }}
        run: |
          # shellcheck disable=SC2016 # Markdown backticks are literal.
          printf 'Source: `%s`\n\nCandidate: `%s`\n\nPublish only. Dockhand must bind an exact approved deployment plan, backup, migration rehearsal, rollback digest and runtime verification.\n' "$REVISION" "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
