name: Playwright

on:
  pull_request:

concurrency:
  group: playwright-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_PASSWORD: playwright
          POSTGRES_DB: playwright
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AUTH_SECRET: disposable-playwright-auth-secret
      DATABASE_URL: postgres://postgres:playwright@127.0.0.1:5432/playwright
      APP_BASE_URL_OVERRIDE: http://localhost:3000
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check affected
        id: affected
        shell: bash
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
          TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          TURBO_VERSION="$(node -p "require('./package.json').devDependencies.turbo")"
          if npx -y "turbo@${TURBO_VERSION}" query affected --tasks test:e2e --exit-code >/tmp/playwright-query.json 2>/tmp/playwright-query.log; then
            echo "run=false" >>"$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -eq 1 ]; then
              echo "run=true" >>"$GITHUB_OUTPUT"
            else
              cat /tmp/playwright-query.log
              cat /tmp/playwright-query.json
              exit "$status"
            fi
          fi
      - uses: oven-sh/setup-bun@v2
        if: steps.affected.outputs.run == 'true'
        with:
          bun-version: 1.3.1
      - uses: actions/cache@v4
        if: steps.affected.outputs.run == 'true'
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - if: steps.affected.outputs.run == 'true'
        run: bun install --frozen-lockfile
      - uses: actions/cache@v4
        if: steps.affected.outputs.run == 'true'
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/bun.lock') }}
      - name: Migrate disposable database
        if: steps.affected.outputs.run == 'true'
        run: node apps/chat/scripts/docker-migrate.cjs
      - name: Install Playwright browsers
        if: steps.affected.outputs.run == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: apps/chat/node_modules/.bin/playwright install --with-deps chromium
      - if: steps.affected.outputs.run == 'true'
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
          TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bunx turbo run test:e2e --affected
      - uses: actions/upload-artifact@v4
        if: steps.affected.outputs.run == 'true' && always() && !cancelled()
        with:
          name: playwright-report
          path: apps/chat/playwright-report/
          retention-days: 7
