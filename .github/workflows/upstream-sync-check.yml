name: Upstream Sync Check
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: upstream-chat-js
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'masonjames/sparka'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: ./.github/workflows/upstream-sync-pr.yml
