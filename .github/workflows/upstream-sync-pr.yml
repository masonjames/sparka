name: Upstream Sync PR
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  workflow_call:
permissions: {}
concurrency:
  group: upstream-chat-js-pr
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'masonjames/sparka'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare direct merge
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/FranciscoMoretti/chat-js.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo 'Up to date' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -n "$(gh pr list --head codex/upstream-chat-js --state open --json number --jq '.[0].number // empty')" ]; then
            echo 'Existing upstream PR awaits review' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git branch "backup-before-upstream-merge-$(date +%Y%m%d)"
          git switch -c codex/upstream-chat-js
          if ! git merge --no-ff --no-edit upstream/main; then
            git diff --name-only --diff-filter=U > /tmp/upstream-conflicts.txt
            git merge --abort
            exit 1
          fi
          echo 'needed=true' >> "$GITHUB_OUTPUT"
      - name: Validate merged candidate with Dagger
        if: steps.merge.outputs.needed == 'true'
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: v0.21.9
          verb: call
          args: check
      - name: Build and smoke-test merged candidate with Dagger
        if: steps.merge.outputs.needed == 'true'
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: v0.21.9
          verb: call
          args: smoke
      - name: Publish draft PR
        if: steps.merge.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git remote set-url origin https://github.com/masonjames/sparka.git
          # A closed prior PR may leave a branch: replace only the observed ref.
          old=$(git ls-remote origin refs/heads/codex/upstream-chat-js | cut -f1)
          git push --force-with-lease="refs/heads/codex/upstream-chat-js:$old" origin HEAD:refs/heads/codex/upstream-chat-js
          cat > /tmp/upstream-pr.md <<'BODY'
          Merge the latest FranciscoMoretti/chat-js main while retaining the Sparka fork.

          Dagger passed fork contracts, unit tests, types, disposable migration rehearsal, and the Linux/AMD64 image build on this merge commit. Review the subscription, authentication, storage, and migration changes before merging. GITHUB_TOKEN-created PRs do not automatically trigger other PR workflows; the checks above ran explicitly here.

          After review, publish an immutable candidate with Build and Push to GHCR or local Dagger. Production promotion requires Dockhand's exact approved plan and runtime verification. No deployment is triggered by this PR.
          BODY
          gh pr create --draft --base main --head codex/upstream-chat-js --title 'Sync latest chat-js upstream' --body-file /tmp/upstream-pr.md
      - name: Report actionable failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          printf 'Upstream merge or Dagger validation failed. Review %s before retrying.\n' "$RUN_URL" > /tmp/upstream-failure.md
          if [ -f /tmp/upstream-conflicts.txt ]; then
            cat /tmp/upstream-conflicts.txt >> /tmp/upstream-failure.md
          fi
          issue=$(gh issue list --state open --search '"Chat-js upstream sync blocked" in:title' --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --body-file /tmp/upstream-failure.md
          else
            gh issue create --title 'Chat-js upstream sync blocked' --body-file /tmp/upstream-failure.md
          fi
